<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>AutoBooks CA ⚡</title>

<script src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#080c14;color:#e2e8f0;font-family:system-ui,sans-serif}
button{cursor:pointer}
.card{background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.08);border-radius:12px}
.inp{background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.12);border-radius:8px;padding:8px 12px;color:#e2e8f0;width:100%}
.nav{background:#0d1526;border-bottom:1px solid rgba(255,255,255,0.08);padding:10px 16px;display:flex;justify-content:space-between;align-items:center}
.tab-btn{padding:6px 10px;border:none;background:transparent;color:#64748b;font-size:13px}
.tab-btn.active{color:#fbbf24;border-bottom:2px solid #f59e0b}
.main{padding:16px}
</style>
</head>

<body>
<div id="root"></div>

<script type="text/babel">

const {useState} = React;

const GST = 0.18;

function makeEntries(bill){
  const amt=bill.amount;
  const gst=parseFloat((amt*GST).toFixed(2));
  const tot=parseFloat((amt+gst).toFixed(2));
  const e=[];
  if(bill.type==="SALE"){
    e.push({acc:"CASH",dr:tot,cr:0});
    e.push({acc:"SALES",dr:0,cr:amt});
    e.push({acc:"GST",dr:0,cr:gst});
  }
  if(bill.type==="EXPENSE"){
    e.push({acc:"EXP",dr:amt,cr:0});
    e.push({acc:"CASH",dr:0,cr:amt});
  }
  return e;
}

let gid=1;

function App(){

  const [tab,setTab]=useState("dashboard");
  const [txs,setTxs]=useState([]);

  const addTx=(bill)=>{
    const tx={
      id:gid++,
      ...bill,
      entries:makeEntries(bill)
    };
    setTxs([tx,...txs]);
  };

  const totalSales=txs.filter(t=>t.type==="SALE").reduce((s,t)=>s+t.amount,0);
  const totalExpense=txs.filter(t=>t.type==="EXPENSE").reduce((s,t)=>s+t.amount,0);
  const profit=totalSales-totalExpense;

  return(
    <div>
      <div className="nav">
        <div style={{fontWeight:700,color:"#fbbf24"}}>⚡ AutoBooks CA</div>
        <div>
          {["dashboard","journal"].map(t=>(
            <button key={t} 
              onClick={()=>setTab(t)}
              className={"tab-btn "+(tab===t?"active":"")}>
              {t}
            </button>
          ))}
        </div>
      </div>

      <div className="main">
        {tab==="dashboard"&&(
          <div className="card" style={{padding:16}}>
            <h3>Dashboard</h3>
            <p>Total Sales: ₹{totalSales}</p>
            <p>Total Expense: ₹{totalExpense}</p>
            <p>Net Profit: ₹{profit}</p>
          </div>
        )}

        {tab==="journal"&&(
          <div>
            <button onClick={()=>addTx({type:"SALE",amount:5000,narration:"Test Sale"})}>
              Add Demo Sale
            </button>

            <div style={{marginTop:15}}>
              {txs.map(t=>(
                <div key={t.id} className="card" style={{padding:10,marginBottom:8}}>
                  {t.type} — ₹{t.amount}
                </div>
              ))}
            </div>
          </div>
        )}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);

</script>
</body>
</html>
