<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>AutoBooks CA ⚡</title>
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #080c14; color: #e2e8f0; font-family: system-ui, sans-serif; }
    ::-webkit-scrollbar { width: 3px; }
    ::-webkit-scrollbar-thumb { background: #1e3a5f; border-radius: 4px; }
    button { cursor: pointer; font-family: system-ui, sans-serif; }
    input, select, textarea { font-family: system-ui, sans-serif; outline: none; }
    .hrow:hover { background: rgba(255,255,255,0.04) !important; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    const GST = 0.18;
    const ACCOUNTS = {
      CASH:       { code:"1001", name:"Cash in Hand",        type:"Asset"    },
      BANK:       { code:"1002", name:"Bank Account",        type:"Asset"    },
      RECEIVABLE: { code:"1003", name:"Accounts Receivable", type:"Asset"    },
      INVENTORY:  { code:"1004", name:"Stock / Inventory",   type:"Asset"    },
      PAYABLE:    { code:"2001", name:"Accounts Payable",    type:"Liability"},
      GST_PAY:    { code:"2002", name:"GST Payable",         type:"Liability"},
      GST_INPUT:  { code:"2003", name:"GST Input Credit",    type:"Asset"    },
      CAPITAL:    { code:"3001", name:"Owner's Capital",     type:"Equity"   },
      SALES:      { code:"4001", name:"Sales Revenue",       type:"Revenue"  },
      PURCHASE:   { code:"5001", name:"Purchases",           type:"Expense"  },
      SALARY:     { code:"5002", name:"Salary Expense",      type:"Expense"  },
      RENT:       { code:"5003", name:"Rent Expense",        type:"Expense"  },
      MISC:       { code:"5004", name:"Miscellaneous Exp.",  type:"Expense"  },
    };

    const TYPE_LABELS = {
      SALE_CASH:"Sale (Cash)", SALE_CREDIT:"Sale (Credit)",
      PURCHASE_CASH:"Purchase (Cash)", PURCHASE_CREDIT:"Purchase (Credit)",
      EXPENSE:"Expense", RECEIPT:"Receipt", PAYMENT:"Payment"
    };
    const TYPE_COLORS = {
      SALE_CASH:"#22c55e", SALE_CREDIT:"#86efac",
      PURCHASE_CASH:"#f97316", PURCHASE_CREDIT:"#fdba74",
      EXPENSE:"#f43f5e", RECEIPT:"#3b82f6", PAYMENT:"#a78bfa"
    };

    function makeEntries(bill) {
      const amt = bill.amount;
      const gst = parseFloat((amt * GST).toFixed(2));
      const tot = parseFloat((amt + gst).toFixed(2));
      const e = [];
      if (bill.type==="SALE_CASH")        { e.push({account:"CASH",dr:tot,cr:0}); e.push({account:"SALES",dr:0,cr:amt}); e.push({account:"GST_PAY",dr:0,cr:gst}); }
      else if(bill.type==="SALE_CREDIT")  { e.push({account:"RECEIVABLE",dr:tot,cr:0}); e.push({account:"SALES",dr:0,cr:amt}); e.push({account:"GST_PAY",dr:0,cr:gst}); }
      else if(bill.type==="PURCHASE_CASH"){ e.push({account:"PURCHASE",dr:amt,cr:0}); e.push({account:"GST_INPUT",dr:gst,cr:0}); e.push({account:"CASH",dr:0,cr:tot}); }
      else if(bill.type==="PURCHASE_CREDIT"){ e.push({account:"PURCHASE",dr:amt,cr:0}); e.push({account:"GST_INPUT",dr:gst,cr:0}); e.push({account:"PAYABLE",dr:0,cr:tot}); }
      else if(bill.type==="EXPENSE")      { const a=bill.expenseAccount||"MISC"; e.push({account:a,dr:amt,cr:0}); e.push({account:"CASH",dr:0,cr:amt}); }
      else if(bill.type==="RECEIPT")      { e.push({account:"BANK",dr:amt,cr:0}); e.push({account:"RECEIVABLE",dr:0,cr:amt}); }
      else if(bill.type==="PAYMENT")      { e.push({account:"PAYABLE",dr:amt,cr:0}); e.push({account:"BANK",dr:0,cr:amt}); }
      return e;
    }

    let gid = 100;
    const makeTx = (bill, src) => ({
      id: ++gid, date: new Date().toISOString(),
      billNo: bill.billNo || "MAN-"+gid, party: bill.party||"—",
      type: bill.type, amount: bill.amount, narration: bill.narration,
      source: src||"AUTO", expenseAccount: bill.expenseAccount,
      journalEntries: makeEntries(bill),
    });

    const computeBal = (txs) => {
      const b = {}; Object.keys(ACCOUNTS).forEach(k=>b[k]=0);
      txs.forEach(tx=>tx.journalEntries.forEach(e=>{ b[e.account]=(b[e.account]||0)+e.dr-e.cr; }));
      return b;
    };

    const fmt = n => "₹"+Math.abs(n).toLocaleString("en-IN",{minimumFractionDigits:2});
    const fmtD = iso => new Date(iso).toLocaleDateString("en-IN",{day:"2-digit",month:"short",hour:"2-digit",minute:"2-digit"});

    const BILLS = [
      {type:"SALE_CASH",      amount:4500,  narration:"Sale: Mobile Covers + Screen Guards", billNo:"INV-1001", party:"Walk-in Customer"},
      {type:"SALE_CREDIT",    amount:12000, narration:'Sale: Samsung TV 32"',                billNo:"INV-1002", party:"Ramesh Electronics"},
      {type:"PURCHASE_CASH",  amount:25000, narration:"Stock Purchase: Electronics",        billNo:"PUR-501",  party:"Raj Distributors"},
      {type:"SALE_CASH",      amount:2200,  narration:"Sale: Earphones x5 + Cable x3",      billNo:"INV-1003", party:"Walk-in Customer"},
      {type:"EXPENSE",        amount:8000,  narration:"Monthly Shop Rent - March 2025",     billNo:"RENT-03",  party:"Landlord", expenseAccount:"RENT"},
      {type:"PURCHASE_CREDIT",amount:40000, narration:"Stock: Smartphones Batch",           billNo:"PUR-502",  party:"Galaxy Wholesale"},
      {type:"SALE_CASH",      amount:15000, narration:"Sale: iPhone Case + AirPods",        billNo:"INV-1004", party:"Priya Sharma"},
      {type:"RECEIPT",        amount:12000, narration:"Payment from Ramesh Electronics",   billNo:"RCP-201",  party:"Ramesh Electronics"},
      {type:"EXPENSE",        amount:25000, narration:"Staff Salaries - March 2025",        billNo:"SAL-03",   party:"Staff", expenseAccount:"SALARY"},
      {type:"PAYMENT",        amount:40000, narration:"Payment to Galaxy Wholesale",        billNo:"PAY-301",  party:"Galaxy Wholesale"},
    ];

    const C = {
      card:{background:"rgba(255,255,255,0.03)",border:"1px solid rgba(255,255,255,0.08)",borderRadius:12},
      inp:{background:"rgba(255,255,255,0.06)",border:"1px solid rgba(255,255,255,0.12)",borderRadius:8,padding:"8px 12px",color:"#e2e8f0",fontSize:13,width:"100%"},
      lbl:{fontSize:10,color:"#64748b",display:"block",marginBottom:4,textTransform:"uppercase",letterSpacing:"0.8px"},
    };

    function Modal({title,onClose,children}){
      return (
        <div onClick={onClose} style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.85)",zIndex:999,display:"flex",alignItems:"center",justifyContent:"center"}}>
          <div onClick={e=>e.stopPropagation()} style={{background:"#0f172a",border:"1px solid rgba(255,255,255,0.12)",borderRadius:16,padding:24,width:500,maxHeight:"85vh",overflowY:"auto"}}>
            <div style={{display:"flex",justifyContent:"space-between",marginBottom:20}}>
              <span style={{fontSize:15,fontWeight:700,color:"#f1f5f9"}}>{title}</span>
              <button onClick={onClose} style={{background:"none",border:"none",color:"#64748b",fontSize:20}}>✕</button>
            </div>
            {children}
          </div>
        </div>
      );
    }

    function TxForm({tx,onSave,onDelete}){
      const [f,setF] = useState({
        type:tx?.type||"SALE_CASH", amount:tx?.amount||"",
        narration:tx?.narration||"", billNo:tx?.billNo||"MAN-"+Date.now(),
        party:tx?.party||"", expenseAccount:tx?.expenseAccount||"MISC",
      });
      const set=(k,v)=>setF(p=>({...p,[k]:v}));
      const hasGST=f.amount&&["SALE_CASH","SALE_CREDIT","PURCHASE_CASH","PURCHASE_CREDIT"].includes(f.type);
      return(
        <div style={{display:"flex",flexDirection:"column",gap:12}}>
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10}}>
            <div><label style={C.lbl}>Type</label>
              <select value={f.type} onChange={e=>set("type",e.target.value)} style={C.inp}>
                {Object.entries(TYPE_LABELS).map(([k,v])=><option key={k} value={k}>{v}</option>)}
              </select>
            </div>
            <div><label style={C.lbl}>Amount ₹ (excl. GST)</label>
              <input type="number" value={f.amount} onChange={e=>set("amount",parseFloat(e.target.value)||"")} style={C.inp} placeholder="e.g. 5000"/>
            </div>
            <div><label style={C.lbl}>Bill / Voucher No.</label>
              <input value={f.billNo} onChange={e=>set("billNo",e.target.value)} style={C.inp}/>
            </div>
            <div><label style={C.lbl}>Party Name</label>
              <input value={f.party} onChange={e=>set("party",e.target.value)} style={C.inp} placeholder="Customer / Vendor"/>
            </div>
          </div>
          {f.type==="EXPENSE"&&(
            <div><label style={C.lbl}>Expense Category</label>
              <select value={f.expenseAccount} onChange={e=>set("expenseAccount",e.target.value)} style={C.inp}>
                <option value="SALARY">Salary</option>
                <option value="RENT">Rent</option>
                <option value="MISC">Miscellaneous</option>
              </select>
            </div>
          )}
          <div><label style={C.lbl}>Narration</label>
            <textarea value={f.narration} onChange={e=>set("narration",e.target.value)} rows={2} style={{...C.inp,resize:"none"}} placeholder="Description of transaction"/>
          </div>
          {hasGST&&(
            <div style={{padding:"8px 12px",background:"rgba(245,158,11,0.08)",borderRadius:8,border:"1px solid rgba(245,158,11,0.2)",fontSize:12,color:"#fbbf24"}}>
              GST @18% = ₹{(f.amount*0.18).toFixed(2)} · Total = ₹{(f.amount*1.18).toFixed(2)}
            </div>
          )}
          <div style={{display:"flex",gap:8,justifyContent:"flex-end"}}>
            {onDelete&&<button onClick={onDelete} style={{padding:"8px 14px",borderRadius:8,border:"1px solid rgba(244,63,94,0.4)",background:"rgba(244,63,94,0.1)",color:"#f87171",fontSize:12,fontWeight:600}}>🗑 Delete</button>}
            <button onClick={()=>onSave(f)} disabled={!f.amount||!f.narration} style={{padding:"8px 20px",borderRadius:8,border:"none",background:!f.amount||!f.narration?"#1e293b":"linear-gradient(135deg,#f59e0b,#d97706)",color:!f.amount||!f.narration?"#475569":"#0a0f1e",fontSize:12,fontWeight:700,cursor:!f.amount||!f.narration?"not-allowed":"pointer"}}>
              {tx?"Save Changes":"Post Transaction"}
            </button>
          </div>
        </div>
      );
    }

    function App(){
      const [txs,setTxs] = useState(BILLS.slice(0,4).map(b=>makeTx(b,"IMPORT")));
      const [queue,setQueue] = useState(BILLS.slice(4));
      const [tab,setTab] = useState("dashboard");
      const [importing,setImporting] = useState(false);
      const [logs,setLogs] = useState([{msg:"✅ Connected to Shop POS",ts:new Date()}]);
      const [editTx,setEditTx] = useState(null);
      const [showAdd,setShowAdd] = useState(false);
      const [ledgerAcc,setLedgerAcc] = useState("SALES");
      const [aiText,setAiText] = useState("");
      const [aiLoading,setAiLoading] = useState(false);
      const logRef = useRef(null);

      const bal = computeBal(txs);
      const totalSales = txs.filter(t=>t.type.startsWith("SALE")).reduce((s,t)=>s+t.amount,0);
      const totalPurchase = txs.filter(t=>t.type.startsWith("PURCHASE")).reduce((s,t)=>s+t.amount,0);
      const totalExpense = txs.filter(t=>t.type==="EXPENSE").reduce((s,t)=>s+t.amount,0);
      const grossProfit = totalSales-totalPurchase;
      const netProfit = grossProfit-totalExpense;

      const addLog = msg=>setLogs(l=>[...l.slice(-29),{msg,ts:new Date()}]);
      useEffect(()=>{ if(logRef.current) logRef.current.scrollTop=logRef.current.scrollHeight; },[logs]);

      const importBill=()=>{
        if(!queue.length||importing) return;
        const bill=queue[0]; setImporting(true);
        addLog("📥 Receiving: "+(bill.billNo||"NEW")+" — "+TYPE_LABELS[bill.type]);
        setTimeout(()=>{
          const tx=makeTx(bill,"AUTO");
          setTxs(t=>[tx,...t]); setQueue(q=>q.slice(1));
          addLog("✅ Posted "+tx.journalEntries.length+" entries for "+tx.billNo);
          setImporting(false);
        },1200);
      };

      const getAI=async()=>{
        setAiLoading(true);
        const summary=`Sales:${fmt(totalSales)}, Purchases:${fmt(totalPurchase)}, Expenses:${fmt(totalExpense)}, NetProfit:${fmt(netProfit)}, Cash:${fmt(bal["CASH"]||0)}, GSTPayable:${fmt((bal["GST_PAY"]||0)-(bal["GST_INPUT"]||0))}, Receivables:${fmt(bal["RECEIVABLE"]||0)}`;
        try{
          const res=await fetch("https://api.anthropic.com/v1/messages",{
            method:"POST",headers:{"Content-Type":"application/json"},
            body:JSON.stringify({model:"claude-sonnet-4-20250514",max_tokens:1000,
              system:"You are a CA giving sharp advice to a small shop owner. Give 5 bullet points on GST, cash flow, profitability, and one risk. Be specific with numbers. Under 180 words.",
              messages:[{role:"user",content:"Analyse: "+summary}]})
          });
          const data=await res.json();
          setAiText(data.content?.map(b=>b.text||"").join("")||"No response.");
        }catch{ setAiText("⚠️ Could not connect. Check internet."); }
        setAiLoading(false);
      };

      const TABS=[["dashboard","📊 Dashboard"],["journal","📋 Journal"],["ledger","📒 Ledger"],["trial","⚖️ Trial Balance"],["pl","📈 P&L"]];

      return(
        <div style={{fontFamily:"system-ui,sans-serif",background:"#080c14",minHeight:"100vh",color:"#e2e8f0"}}>

          {/* NAV */}
          <div style={{background:"#0d1526",borderBottom:"1px solid rgba(255,255,255,0.08)",padding:"0 16px",display:"flex",alignItems:"center",justifyContent:"space-between",height:54,position:"sticky",top:0,zIndex:100}}>
            <div style={{display:"flex",alignItems:"center",gap:10}}>
              <div style={{background:"linear-gradient(135deg,#f59e0b,#d97706)",width:34,height:34,borderRadius:10,display:"flex",alignItems:"center",justifyContent:"center",fontSize:18}}>⚡</div>
              <div>
                <div style={{fontSize:15,fontWeight:800,color:"#fbbf24"}}>AutoBooks CA</div>
                <div style={{fontSize:10,color:"#475569",textTransform:"uppercase",letterSpacing:"1px"}}>Live Bookkeeping Engine</div>
              </div>
            </div>
            <div style={{display:"flex",gap:2}}>
              {TABS.map(([id,label])=>(
                <button key={id} onClick={()=>setTab(id)} style={{padding:"6px 11px",borderRadius:7,border:"none",fontSize:12,fontWeight:500,background:tab===id?"rgba(245,158,11,0.15)":"transparent",color:tab===id?"#fbbf24":"#64748b",cursor:"pointer",borderBottom:tab===id?"2px solid #f59e0b":"2px solid transparent"}}>
                  {label}
                </button>
              ))}
            </div>
            <div style={{display:"flex",gap:8,alignItems:"center"}}>
              <div style={{display:"flex",alignItems:"center",gap:5,padding:"4px 10px",borderRadius:20,background:"rgba(34,197,94,0.1)",border:"1px solid rgba(34,197,94,0.2)"}}>
                <div style={{width:6,height:6,borderRadius:"50%",background:"#22c55e"}}/>
                <span style={{fontSize:11,color:"#22c55e",fontWeight:600}}>POS LIVE</span>
              </div>
              <button onClick={importBill} disabled={importing||!queue.length} style={{padding:"6px 13px",borderRadius:8,fontSize:12,fontWeight:600,border:"none",background:queue.length&&!importing?"linear-gradient(135deg,#f59e0b,#d97706)":"#1e293b",color:queue.length&&!importing?"#0a0f1e":"#475569",cursor:queue.length&&!importing?"pointer":"not-allowed"}}>
                {importing?"⏳ Importing…":queue.length===0?"✓ All Synced":`📥 Import Bill (${queue.length})`}
              </button>
              <button onClick={()=>setShowAdd(true)} style={{padding:"6px 13px",borderRadius:8,fontSize:12,fontWeight:600,border:"1px solid rgba(99,179,237,0.3)",background:"rgba(59,130,246,0.1)",color:"#93c5fd",cursor:"pointer"}}>
                + Manual Entry
              </button>
            </div>
          </div>

          {/* BODY */}
          <div style={{display:"flex",height:"calc(100vh - 54px)"}}>

            {/* SIDEBAR */}
            <div style={{width:210,borderRight:"1px solid rgba(255,255,255,0.06)",display:"flex",flexDirection:"column",flexShrink:0}}>
              <div style={{padding:"8px 12px",fontSize:9,fontWeight:700,color:"#334155",letterSpacing:"1.5px",textTransform:"uppercase",borderBottom:"1px solid rgba(255,255,255,0.06)"}}>Live POS Feed</div>
              <div ref={logRef} style={{flex:1,overflowY:"auto",padding:"8px 10px",display:"flex",flexDirection:"column",gap:4}}>
                {logs.map((l,i)=>(
                  <div key={i} style={{fontSize:10.5,color:"#94a3b8",lineHeight:1.5,padding:"5px 8px",borderRadius:6,background:"rgba(255,255,255,0.02)",borderLeft:"2px solid rgba(245,158,11,0.25)"}}>
                    <div>{l.msg}</div>
                    <div style={{color:"#334155",fontSize:9,marginTop:2}}>{l.ts.toLocaleTimeString("en-IN")}</div>
                  </div>
                ))}
              </div>
              <div style={{padding:"10px 14px",borderTop:"1px solid rgba(255,255,255,0.06)"}}>
                <div style={{fontSize:9,color:"#475569",textTransform:"uppercase",letterSpacing:"1px",marginBottom:4}}>Bills Pending</div>
                <div style={{fontSize:22,fontWeight:800,color:queue.length>0?"#f59e0b":"#22c55e"}}>{queue.length}</div>
              </div>
            </div>

            {/* MAIN */}
            <div style={{flex:1,overflowY:"auto",padding:18}}>

              {/* DASHBOARD */}
              {tab==="dashboard"&&(
                <div>
                  <div style={{display:"grid",gridTemplateColumns:"repeat(5,1fr)",gap:10,marginBottom:16}}>
                    {[
                      {label:"Total Sales",val:fmt(totalSales),color:"#22c55e"},
                      {label:"Net Profit",val:fmt(netProfit),color:netProfit>=0?"#22c55e":"#f43f5e"},
                      {label:"Cash Balance",val:fmt(bal["CASH"]||0),color:"#fbbf24"},
                      {label:"GST Payable",val:fmt((bal["GST_PAY"]||0)-(bal["GST_INPUT"]||0)),color:"#f97316"},
                      {label:"Receivables",val:fmt(bal["RECEIVABLE"]||0),color:"#3b82f6"},
                    ].map((k,i)=>(
                      <div key={i} style={{...C.card,padding:"14px 16px"}}>
                        <div style={{fontSize:10,color:"#475569",textTransform:"uppercase",letterSpacing:"1px",marginBottom:6}}>{k.label}</div>
                        <div style={{fontSize:17,fontWeight:800,color:k.color,fontFamily:"monospace"}}>{k.val}</div>
                      </div>
                    ))}
                  </div>

                  <div style={{display:"grid",gridTemplateColumns:"3fr 2fr",gap:14}}>
                    <div style={C.card}>
                      <div style={{padding:"11px 14px",borderBottom:"1px solid rgba(255,255,255,0.06)",fontWeight:700,fontSize:13}}>Recent Transactions</div>
                      <div style={{maxHeight:370,overflowY:"auto"}}>
                        {txs.map(tx=>(
                          <div key={tx.id} className="hrow" style={{padding:"9px 14px",borderBottom:"1px solid rgba(255,255,255,0.04)",display:"flex",alignItems:"center",gap:10}}>
                            <div style={{width:8,height:8,borderRadius:"50%",background:TYPE_COLORS[tx.type]||"#64748b",flexShrink:0}}/>
                            <div style={{flex:1,minWidth:0}}>
                              <div style={{fontSize:12,fontWeight:600,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{tx.narration}</div>
                              <div style={{fontSize:10,color:"#475569",marginTop:1}}>{tx.billNo} · {tx.party}</div>
                            </div>
                            <div style={{textAlign:"right",flexShrink:0}}>
                              <div style={{fontSize:12,fontFamily:"monospace",fontWeight:700,color:tx.type.startsWith("SALE")||tx.type==="RECEIPT"?"#22c55e":"#f43f5e"}}>
                                {tx.type.startsWith("SALE")||tx.type==="RECEIPT"?"+":"-"}{fmt(tx.amount)}
                              </div>
                              <div style={{fontSize:9,color:tx.source==="AUTO"?"#fbbf24":"#93c5fd",textTransform:"uppercase"}}>{tx.source}</div>
                            </div>
                            <button onClick={()=>setEditTx(tx)} style={{padding:"3px 8px",borderRadius:5,border:"1px solid rgba(255,255,255,0.1)",background:"transparent",color:"#64748b",fontSize:10}}>Edit</button>
                          </div>
                        ))}
                      </div>
                    </div>

                    <div style={{...C.card,padding:16,display:"flex",flexDirection:"column",gap:12}}>
                      <div style={{fontWeight:700,fontSize:13}}>🤖 AI CA Insights</div>
                      {!aiText&&!aiLoading&&(
                        <div style={{flex:1,display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",gap:10,textAlign:"center"}}>
                          <div style={{fontSize:34}}>📊</div>
                          <div style={{fontSize:12,color:"#475569"}}>Get CA-level analysis of your current books</div>
                          <button onClick={getAI} style={{padding:"8px 16px",borderRadius:8,background:"linear-gradient(135deg,#f59e0b,#d97706)",border:"none",color:"#0a0f1e",fontWeight:700,fontSize:12,cursor:"pointer"}}>Analyse Now</button>
                        </div>
                      )}
                      {aiLoading&&<div style={{flex:1,display:"flex",alignItems:"center",justifyContent:"center",color:"#f59e0b",fontSize:13}}>⚡ Analysing books…</div>}
                      {aiText&&!aiLoading&&(
                        <div style={{flex:1,overflowY:"auto",fontSize:12,lineHeight:1.7,color:"#cbd5e1"}}>
                          {aiText.split("\n").filter(Boolean).map((line,i)=>(
                            <div key={i} style={{display:"flex",gap:6,marginBottom:7}}>
                              <span style={{color:"#f59e0b",flexShrink:0}}>▸</span>
                              <span>{line.replace(/^[-•*]\s*/,"")}</span>
                            </div>
                          ))}
                          <button onClick={()=>setAiText("")} style={{fontSize:10,color:"#475569",background:"none",border:"none",cursor:"pointer",marginTop:6}}>↺ Re-analyse</button>
                        </div>
                      )}
                    </div>
                  </div>
                </div>
              )}

              {/* JOURNAL */}
              {tab==="journal"&&(
                <div>
                  <div style={{marginBottom:12,fontSize:16,fontWeight:800}}>Journal Entries</div>
                  <div style={{...C.card,overflow:"hidden"}}>
                    <table style={{width:"100%",borderCollapse:"collapse",fontSize:12}}>
                      <thead>
                        <tr style={{background:"rgba(255,255,255,0.04)"}}>
                          {["Date","Bill No","Party","Narration","Account","Dr","Cr","Source"].map(h=>(
                            <th key={h} style={{padding:"9px 12px",textAlign:"left",color:"#475569",fontSize:10,fontWeight:600,textTransform:"uppercase"}}>{h}</th>
                          ))}
                        </tr>
                      </thead>
                      <tbody>
                        {txs.flatMap(tx=>tx.journalEntries.map((e,ei)=>(
                          <tr key={tx.id+"-"+ei} style={{borderTop:"1px solid rgba(255,255,255,0.04)"}}>
                            <td style={{padding:"7px 12px",color:"#64748b",fontFamily:"monospace",fontSize:10}}>{ei===0?fmtD(tx.date):""}</td>
                            <td style={{padding:"7px 12px",color:"#fbbf24",fontFamily:"monospace",fontSize:10}}>{ei===0?tx.billNo:""}</td>
                            <td style={{padding:"7px 12px",color:"#94a3b8",fontSize:11}}>{ei===0?tx.party:""}</td>
                            <td style={{padding:"7px 12px",color:"#94a3b8",fontSize:11,maxWidth:180,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{ei===0?tx.narration:""}</td>
                            <td style={{padding:"7px 12px",fontWeight:500}}>{ACCOUNTS[e.account]?.name}</td>
                            <td style={{padding:"7px 12px",color:"#22c55e",fontFamily:"monospace",fontWeight:600,textAlign:"right"}}>{e.dr>0?fmt(e.dr):""}</td>
                            <td style={{padding:"7px 12px",color:"#f97316",fontFamily:"monospace",fontWeight:600,textAlign:"right"}}>{e.cr>0?fmt(e.cr):""}</td>
                            <td style={{padding:"7px 12px"}}><span style={{fontSize:9,padding:"2px 6px",borderRadius:10,background:tx.source==="AUTO"?"rgba(245,158,11,0.15)":"rgba(59,130,246,0.15)",color:tx.source==="AUTO"?"#fbbf24":"#93c5fd"}}>{tx.source}</span></td>
                          </tr>
                        )))}
                      </tbody>
                    </table>
                  </div>
                </div>
              )}

              {/* LEDGER */}
              {tab==="ledger"&&(
                <div>
                  <div style={{display:"flex",flexWrap:"wrap",gap:6,marginBottom:14}}>
                    {Object.keys(ACCOUNTS).map(k=>(
                      <button key={k} onClick={()=>setLedgerAcc(k)} style={{padding:"4px 10px",borderRadius:20,fontSize:11,border:`1px solid ${ledgerAcc===k?"rgba(245,158,11,0.5)":"rgba(255,255,255,0.08)"}`,background:ledgerAcc===k?"rgba(245,158,11,0.12)":"transparent",color:ledgerAcc===k?"#fbbf24":"#64748b",cursor:"pointer"}}>
                        {ACCOUNTS[k].name}
                      </button>
                    ))}
                  </div>
                  <div style={C.card}>
                    <div style={{padding:"12px 16px",borderBottom:"1px solid rgba(255,255,255,0.06)",display:"flex",justifyContent:"space-between"}}>
                      <div>
                        <div style={{fontWeight:700,fontSize:14}}>{ACCOUNTS[ledgerAcc]?.name}</div>
                        <div style={{fontSize:11,color:"#475569"}}>{ACCOUNTS[ledgerAcc]?.code} · {ACCOUNTS[ledgerAcc]?.type}</div>
                      </div>
                      <div style={{textAlign:"right"}}>
                        <div style={{fontSize:11,color:"#475569"}}>Balance</div>
                        <div style={{fontSize:18,fontWeight:800,fontFamily:"monospace",color:(bal[ledgerAcc]||0)>=0?"#22c55e":"#f43f5e"}}>
                          {fmt(Math.abs(bal[ledgerAcc]||0))} {(bal[ledgerAcc]||0)>=0?"Dr":"Cr"}
                        </div>
                      </div>
                    </div>
                    <table style={{width:"100%",borderCollapse:"collapse",fontSize:12}}>
                      <thead>
                        <tr style={{background:"rgba(255,255,255,0.03)"}}>
                          {["Date","Bill No","Narration","Dr","Cr","Running Bal"].map(h=>(
                            <th key={h} style={{padding:"9px 12px",textAlign:["Dr","Cr","Running Bal"].includes(h)?"right":"left",color:"#475569",fontSize:10,fontWeight:600,textTransform:"uppercase"}}>{h}</th>
                          ))}
                        </tr>
                      </thead>
                      <tbody>
                        {(()=>{
                          let run=0;
                          return [...txs].reverse().flatMap(tx=>
                            tx.journalEntries.filter(e=>e.account===ledgerAcc).map((e,i)=>{
                              run+=e.dr-e.cr;
                              return(
                                <tr key={tx.id+"-"+i} style={{borderTop:"1px solid rgba(255,255,255,0.04)"}}>
                                  <td style={{padding:"7px 12px",color:"#64748b",fontFamily:"monospace",fontSize:10}}>{fmtD(tx.date)}</td>
                                  <td style={{padding:"7px 12px",color:"#fbbf24",fontFamily:"monospace",fontSize:10}}>{tx.billNo}</td>
                                  <td style={{padding:"7px 12px",color:"#94a3b8",maxWidth:200,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{tx.narration}</td>
                                  <td style={{padding:"7px 12px",color:"#22c55e",fontFamily:"monospace",textAlign:"right"}}>{e.dr>0?fmt(e.dr):"—"}</td>
                                  <td style={{padding:"7px 12px",color:"#f97316",fontFamily:"monospace",textAlign:"right"}}>{e.cr>0?fmt(e.cr):"—"}</td>
                                  <td style={{padding:"7px 12px",fontFamily:"monospace",fontWeight:700,textAlign:"right",color:run>=0?"#e2e8f0":"#f43f5e"}}>{fmt(Math.abs(run))} {run>=0?"Dr":"Cr"}</td>
                                </tr>
                              );
                            })
                          );
                        })()}
                      </tbody>
                    </table>
                  </div>
                </div>
              )}

              {/* TRIAL BALANCE */}
              {tab==="trial"&&(
                <div>
                  <div style={{marginBottom:12,fontSize:16,fontWeight:800}}>Trial Balance</div>
                  <div style={{...C.card,overflow:"hidden"}}>
                    <table style={{width:"100%",borderCollapse:"collapse",fontSize:12}}>
                      <thead>
                        <tr style={{background:"rgba(255,255,255,0.04)"}}>
                          {["Code","Account","Type","Debit","Credit"].map(h=>(
                            <th key={h} style={{padding:"9px 14px",textAlign:["Debit","Credit"].includes(h)?"right":"left",color:"#475569",fontSize:10,fontWeight:600,textTransform:"uppercase"}}>{h}</th>
                          ))}
                        </tr>
                      </thead>
                      <tbody>
                        {Object.entries(ACCOUNTS).map(([key,acc])=>{
                          const b=bal[key]||0;
                          return(
                            <tr key={key} onClick={()=>{setLedgerAcc(key);setTab("ledger");}} className="hrow" style={{borderTop:"1px solid rgba(255,255,255,0.04)",cursor:"pointer"}}>
                              <td style={{padding:"9px 14px",color:"#475569",fontFamily:"monospace",fontSize:10}}>{acc.code}</td>
                              <td style={{padding:"9px 14px",fontWeight:500}}>{acc.name}</td>
                              <td style={{padding:"9px 14px"}}>
                                <span style={{fontSize:10,padding:"2px 7px",borderRadius:10,background:acc.type==="Asset"?"rgba(34,197,94,0.1)":acc.type==="Liability"?"rgba(244,63,94,0.1)":acc.type==="Revenue"?"rgba(59,130,246,0.1)":"rgba(245,158,11,0.1)",color:acc.type==="Asset"?"#22c55e":acc.type==="Liability"?"#f43f5e":acc.type==="Revenue"?"#93c5fd":"#fbbf24"}}>
                                  {acc.type}
                                </span>
                              </td>
                              <td style={{padding:"9px 14px",textAlign:"right",fontFamily:"monospace",color:"#22c55e",fontWeight:600}}>{b>0?fmt(b):""}</td>
                              <td style={{padding:"9px 14px",textAlign:"right",fontFamily:"monospace",color:"#f43f5e",fontWeight:600}}>{b<0?fmt(Math.abs(b)):""}</td>
                            </tr>
                          );
                        })}
                        <tr style={{background:"rgba(245,158,11,0.07)",borderTop:"2px solid rgba(245,158,11,0.3)"}}>
                          <td colSpan={3} style={{padding:"11px 14px",fontWeight:700,color:"#fbbf24"}}>TOTAL</td>
                          <td style={{padding:"11px 14px",textAlign:"right",fontFamily:"monospace",fontWeight:800,color:"#22c55e",fontSize:13}}>{fmt(Object.values(bal).filter(v=>v>0).reduce((s,v)=>s+v,0))}</td>
                          <td style={{padding:"11px 14px",textAlign:"right",fontFamily:"monospace",fontWeight:800,color:"#f43f5e",fontSize:13}}>{fmt(Object.values(bal).filter(v=>v<0).reduce((s,v)=>s+Math.abs(v),0))}</td>
                        </tr>
                      </tbody>
                    </table>
                  </div>
                </div>
              )}

              {/* P&L */}
              {tab==="pl"&&(
                <div style={{maxWidth:560}}>
                  <div style={{marginBottom:12,fontSize:16,fontWeight:800}}>Profit & Loss Statement</div>
                  <div style={{...C.card,padding:20}}>
                    {[["REVENUE",[["Sales Revenue",bal["SALES"]||0]],bal["SALES"]||0,"#22c55e"],
                      ["COST OF GOODS SOLD",[["Purchases",bal["PURCHASE"]||0]],bal["PURCHASE"]||0,"#f97316"]
                    ].map(([title,rows,total,color])=>(
                      <div key={title} style={{marginBottom:16}}>
                        <div style={{fontSize:10,fontWeight:700,color:"#475569",letterSpacing:"1.5px",textTransform:"uppercase",marginBottom:8}}>{title}</div>
                        {rows.map(([name,val])=>(
                          <div key={name} style={{display:"flex",justifyContent:"space-between",padding:"6px 0",borderBottom:"1px solid rgba(255,255,255,0.04)",fontSize:13,color:"#94a3b8"}}>
                            <span>{name}</span><span style={{fontFamily:"monospace"}}>{fmt(Math.abs(val))}</span>
                          </div>
                        ))}
                        <div style={{display:"flex",justifyContent:"space-between",padding:"8px 0",fontSize:13,fontWeight:700,color}}>
                          <span>Total {title}</span><span style={{fontFamily:"monospace"}}>{fmt(Math.abs(total))}</span>
                        </div>
                      </div>
                    ))}
                    <div style={{padding:"10px 12px",background:"rgba(255,255,255,0.04)",borderRadius:8,display:"flex",justifyContent:"space-between",marginBottom:16,fontSize:14,fontWeight:700}}>
                      <span style={{color:"#fbbf24"}}>Gross Profit</span>
                      <span style={{fontFamily:"monospace",color:grossProfit>=0?"#22c55e":"#f43f5e"}}>{fmt(grossProfit)}</span>
                    </div>
                    <div style={{marginBottom:16}}>
                      <div style={{fontSize:10,fontWeight:700,color:"#475569",letterSpacing:"1.5px",textTransform:"uppercase",marginBottom:8}}>OPERATING EXPENSES</div>
                      {[["Salary","SALARY"],["Rent","RENT"],["Miscellaneous","MISC"]].filter(([,k])=>bal[k]).map(([name,key])=>(
                        <div key={key} style={{display:"flex",justifyContent:"space-between",padding:"6px 0",borderBottom:"1px solid rgba(255,255,255,0.04)",fontSize:13,color:"#94a3b8"}}>
                          <span>{name}</span><span style={{fontFamily:"monospace",color:"#f43f5e"}}>{fmt(bal[key])}</span>
                        </div>
                      ))}
                      <div style={{display:"flex",justifyContent:"space-between",padding:"8px 0",fontSize:13,fontWeight:700,color:"#f43f5e"}}>
                        <span>Total Expenses</span><span style={{fontFamily:"monospace"}}>{fmt(totalExpense)}</span>
                      </div>
                    </div>
                    <div style={{padding:"14px 16px",background:netProfit>=0?"rgba(34,197,94,0.1)":"rgba(244,63,94,0.1)",borderRadius:10,border:`1px solid ${netProfit>=0?"rgba(34,197,94,0.3)":"rgba(244,63,94,0.3)"}`,display:"flex",justifyContent:"space-between",alignItems:"center"}}>
                      <span style={{fontSize:15,fontWeight:800,color:netProfit>=0?"#22c55e":"#f43f5e"}}>Net {netProfit>=0?"Profit":"Loss"}</span>
                      <span style={{fontFamily:"monospace",fontSize:20,fontWeight:800,color:netProfit>=0?"#22c55e":"#f43f5e"}}>{fmt(Math.abs(netProfit))}</span>
                    </div>
                  </div>
                </div>
              )}
            </div>
          </div>

          {editTx&&(
            <Modal title={"Edit: "+editTx.billNo} onClose={()=>setEditTx(null)}>
              <TxForm tx={editTx}
                onSave={f=>{setTxs(t=>t.map(x=>x.id===editTx.id?{...makeTx(f,"MANUAL"),id:editTx.id,date:editTx.date}:x));addLog("✏️ Edited "+editTx.billNo);setEditTx(null);}}
                onDelete={()=>{setTxs(t=>t.filter(x=>x.id!==editTx.id));addLog("🗑 Deleted "+editTx.billNo);setEditTx(null);}}
              />
            </Modal>
          )}

          {showAdd&&(
            <Modal title="Add Manual Transaction" onClose={()=>setShowAdd(false)}>
              <TxForm onSave={f=>{setTxs(t=>[makeTx(f,"MANUAL"),...t]);addLog("✍️ Manual: "+f.narration);setShowAdd(false);}}/>
            </Modal>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App/>);
  </script>
</body>
</html>
